<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>k5-work — codebase overview (T3-style rebuild)</title>
<!--
ASSUMPTIONS: faithful layout rebuild of user screenshot 2 (T3 Code nightly):
top window bar, icon-rail sidebar (hidden until "Menu" button expands it),
center overview, bottom ask bar. No projects panel.
THEME ADAPTATION: reference is neutral dark dev gray; user bans blue-black-gray slop,
so this uses warm espresso #14100C + amber accent, glass blur with solid fallback.
No proprietary assets copied: dots, icons, logo are CSS shapes/text.
SIDEBAR: rail 56px, hover morphs trigger glyph to "<", click toggles 248px panel.
USER BG: set --k5-bg url(...) in :root ASSETS block to swap in personal jpg.
-->
<style>
:root{
  /* ASSETS: replace none with url('assets/img/your-bg.jpg') to use personal background */
  --k5-bg: none;
  --ink:#0A0A0A; --panel:#111111; --panel2:#161616; --line:rgba(255,255,255,.12);
  --txt:#F5F5F5; --dim:#A3A3A3; --faint:#737373;
  --amber:#F5F5F5; --clay:#D4D4D4; --olive:#A3A3A3; --green:#4ADE80; --red:#F87171;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--txt); background:#000; overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0;
  background:var(--ink);
  z-index:-2;
}
body::after{content:none}
.app{display:flex; flex-direction:column; height:100vh}
/* top window bar */
.titlebar{display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line);
  background:rgba(10,10,10,.8); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
@supports not (backdrop-filter:blur(1px)){.titlebar{background:var(--panel)}}
.traffic{display:flex; gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#E86A5E}.dot.y{background:#E8A020}.dot.g{background:#7FB069}
.tb-title{font-weight:650; font-size:13px; letter-spacing:.01em}
.tb-title small{color:var(--dim); font-weight:500}
.tb-file{font-family:var(--mono); font-size:12px; color:var(--txt); background:rgba(255,255,255,.07);
  border:1px solid var(--line); padding:3px 10px; border-radius:7px}
.tb-sp{flex:1}
.btn{font:600 12px/1 -apple-system,sans-serif; color:var(--txt); background:rgba(255,255,255,.05);
  border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer}
.btn:hover{border-color:var(--txt)}
.btn.primary{background:var(--txt); border-color:var(--txt); color:#000}
.btn.icon{padding:8px 10px}
.btn svg{width:14px; height:14px; vertical-align:-2px}
/* main row */
.main{flex:1; display:flex; min-height:0}
/* sidebar: hidden by default, expands to full usable panel on demand */
.sidebar{display:flex; background:rgba(10,10,10,.85); backdrop-filter:blur(14px);
  border-right:1px solid var(--line); transition:width .22s ease, border-color .22s ease; overflow:hidden}
@supports not (backdrop-filter:blur(1px)){.sidebar{background:var(--panel)}}
.sidebar.closed{width:0; border-right-color:transparent}
.sidebar.open{width:56px}
.railcol{width:56px; min-width:56px; display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:6px}
.ric{width:36px;height:36px; border-radius:9px; display:grid; place-items:center; cursor:pointer;
  color:var(--dim); border:1px solid transparent; font-size:15px}
.ric svg{width:18px; height:18px; display:block}
.ric:hover{background:rgba(255,255,255,.08); color:var(--txt)}
.ric.trigger{border-color:var(--line); color:var(--txt); font-weight:700}
.ric.trigger .lt{display:none}
.ric.trigger:hover .glyph{display:none}
.ric.trigger:hover .lt{display:inline}
.sidebar.closed .railcol{visibility:hidden}
.center{flex:1; min-width:0; display:flex; flex-direction:column; padding:18px 28px 12px; overflow-y:auto}
.sumrow{display:grid; grid-template-columns:130px 1fr; gap:0; font-size:13px; margin-bottom:2px}
.sumrow .k{font-family:var(--mono); color:var(--txt); padding:8px 12px; border-bottom:1px solid var(--line)}
.sumrow .v{font-family:var(--mono); color:var(--dim); padding:8px 12px; border-bottom:1px solid var(--line)}
.sumrow .v b{color:var(--txt); font-weight:600}
.note{color:var(--dim); font-size:13px; margin:12px 0}
.note code{font-family:var(--mono); background:rgba(255,255,255,.09); padding:1px 6px; border-radius:5px; color:var(--txt)}
.files-h{display:flex; align-items:center; gap:10px; margin:14px 0 8px; font-family:var(--mono); font-size:12px; color:var(--dim)}
.files-h .sp{flex:1}
.linkbtn{background:none;border:1px solid var(--line); color:var(--txt); border-radius:7px; font-size:12px;
  padding:5px 10px; cursor:pointer}
.tree{font-family:var(--mono); font-size:12.5px; border:1px solid var(--line); border-radius:10px;
  background:rgba(0,0,0,.25); padding:10px 14px}
.trow{display:flex; gap:8px; padding:2.5px 0; color:var(--dim)}
.trow .nm{color:var(--txt)}
.trow .chg{margin-left:auto; white-space:nowrap}
.add{color:var(--green)} .del{color:var(--red)}
.trow.file .nm::before{content:""; display:inline-block; width:8px; height:8px; border-radius:2px;
  background:#737373; margin-right:8px; opacity:.9}
.trow.file.red .nm::before{background:#A3A3A3}
.stamp{color:var(--faint); font-family:var(--mono); font-size:11px; margin:8px 2px}
/* bottom ask bar */
.ask{margin:8px 0 4px; border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  background:rgba(22,22,22,.9); backdrop-filter:blur(12px)}
@supports not (backdrop-filter:blur(1px)){.ask{background:var(--panel2)}}
.ask input{width:100%; background:none; border:0; outline:0; color:var(--txt); font-size:13.5px}
.ask input::placeholder{color:var(--faint)}
.pills{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap}
.pill{font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:5px 11px;
  cursor:pointer; background:none}
.pill:hover{color:var(--txt); border-color:var(--txt)}
.pill.hot{color:#000; background:var(--txt); border-color:var(--txt)}
.pill .dotsep{opacity:.5}
.sendrow{margin-left:auto; display:flex; gap:8px; align-items:center}
.go{width:34px;height:34px;border-radius:50%; border:0; cursor:pointer; background:var(--txt);
  color:#000; font-size:16px; font-weight:700}
.meta{display:flex; gap:14px; color:var(--faint); font-size:11.5px; margin-top:8px; font-family:var(--mono)}
/* empty start state */
.center.empty{display:flex; align-items:center; justify-content:center}
.hero{width:min(760px,92%); text-align:center}
.hero h1{font-size:clamp(22px,3.4vw,32px); font-weight:500; letter-spacing:-.01em; margin-bottom:22px}
.hero h1 u{text-decoration:underline dotted; text-underline-offset:5px; text-decoration-color:var(--faint)}
.bigbox{text-align:left; border:1px solid var(--line); border-radius:16px; padding:16px 18px 14px;
  background:rgba(22,22,22,.9); backdrop-filter:blur(12px); min-height:150px; display:flex; flex-direction:column}
@supports not (backdrop-filter:blur(1px)){.bigbox{background:var(--panel2)}}
.bigbox textarea{width:100%; background:none; border:0; outline:0; color:var(--txt); font-size:14px;
  resize:none; min-height:64px; font-family:inherit}
.bigbox textarea::placeholder{color:var(--faint)}
.bigrow{display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap}
.bigrow .sendrow{margin-left:auto}
.attachbtn{background:none; border:0; color:var(--dim); font-size:16px; cursor:pointer; padding:6px}
.attachbtn:hover{color:var(--txt)}
@media (max-width:900px){.sumrow{grid-template-columns:1fr} .center{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="traffic"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <button class="btn" id="expandBtn" title="show sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg> Menu</button>
    <div class="tb-title">k5-work <small>NIGHTLY</small></div>
    <div class="tb-file">Codebase overview&nbsp;&nbsp;t3.gg</div>
    <div class="tb-sp"></div>
    <button class="btn">+ Add action</button>
    <button class="btn">Open</button>
    <button class="btn">Commit &amp; push ▾</button>
    <button class="btn icon" title="more">⋯</button>
  </div>
  <div class="main">
    <aside class="sidebar closed" id="sidebar" aria-label="menu">
      <div class="railcol">
        <div class="ric trigger" id="trigger" title="collapse sidebar"><span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></span><span class="lt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span></div>
        <div class="ric" title="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></div>
        <div class="ric" title="sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="ric" title="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
        <div class="ric" title="browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3c2.5 2.6 3.9 5.7 3.9 9s-1.4 6.4-3.9 9c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3z"/></svg></div>
        <div class="ric" title="connectors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg></div>
      </div>
    </aside>
    <section class="center empty">
      <div class="hero">
        <h1>What should we build in <u>explore</u>?</h1>
        <div class="bigbox">
          <textarea id="askInput" placeholder="Ask for changes, send follow-ups, or attach images"></textarea>
          <div class="bigrow">
            <button class="pill" id="modelPill">Muse Spark 1.3 Free ▾</button>
            <button class="pill">Medium · Build ▾</button>
            <button class="pill">Full access ▾</button>
            <span class="sendrow"><button class="attachbtn" title="attach">⧉</button><button class="go" id="goBtn" title="send">↑</button></span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
<script>
const sb = document.getElementById('sidebar');
const expandBtn = document.getElementById('expandBtn');
function setSidebar(open){
  sb.classList.toggle('open', open);
  sb.classList.toggle('closed', !open);
  expandBtn.style.display = open ? 'none' : '';
  expandBtn.setAttribute('aria-expanded', String(open));
}
expandBtn.addEventListener('click', () => setSidebar(true));
document.getElementById('trigger').addEventListener('click', () => setSidebar(false));
setSidebar(false);
document.getElementById('goBtn').addEventListener('click', () => {
  const box = document.getElementById('askInput');
  const v = box.value.trim();
  if(!v) return;
  box.value='';
  box.placeholder='Queued. Starting from empty — nothing else on screen until it lands.';
});
</script>
</body>
</html>
